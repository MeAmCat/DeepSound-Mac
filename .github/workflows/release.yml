name: Build & Release macOS App

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build app
        run: |
          dotnet publish src/DeepSoundMac.App/DeepSoundMac.App.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained \
            -o publish/DeepSound.app

      - name: Package app
        run: |
          set -e
          cd publish
          if [ ! -d "DeepSound.app" ]; then
            echo "Error: DeepSound.app not found in publish directory"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "DeepSound.app" "DeepSound.zip"
          if [ ! -s "DeepSound.zip" ]; then
            echo "Error: DeepSound.zip was not created or is empty"
            exit 1
          fi
          mv DeepSound.zip "$GITHUB_WORKSPACE"/

      - name: Create release
        uses: >-
          softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          generate_release_notes: true
          files: DeepSound.zip
